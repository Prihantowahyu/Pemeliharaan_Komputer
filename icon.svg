<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Circuit traces -->
  <path d="M 64 160 L 160 160 L 200 200" stroke="#00f0ff" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <circle cx="64" cy="160" r="8" fill="#00f0ff" opacity="0.8"/>
  
  <path d="M 448 160 L 352 160 L 312 200" stroke="#8b5cf6" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <circle cx="448" cy="160" r="8" fill="#8b5cf6" opacity="0.8"/>

  <path d="M 64 352 L 160 352 L 200 312" stroke="#8b5cf6" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <circle cx="64" cy="352" r="8" fill="#8b5cf6" opacity="0.8"/>
  
  <path d="M 448 352 L 352 352 L 312 312" stroke="#00f0ff" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <circle cx="448" cy="352" r="8" fill="#00f0ff" opacity="0.8"/>

  <!-- Center Chip Icon -->
  <rect x="156" y="156" width="200" height="200" rx="44" fill="#0d1b33" stroke="url(#chipGrad)" stroke-width="8" filter="url(#neonGlow)"/>
  
  <!-- Chip Pins -->
  <rect x="186" y="132" width="14" height="24" rx="4" fill="#00f0ff"/>
  <rect x="220" y="132" width="14" height="24" rx="4" fill="#00f0ff"/>
  <rect x="254" y="132" width="14" height="24" rx="4" fill="#00f0ff"/>
  <rect x="288" y="132" width="14" height="24" rx="4" fill="#00f0ff"/>
  <rect x="312" y="132" width="14" height="24" rx="4" fill="#00f0ff"/>

  <rect x="186" y="356" width="14" height="24" rx="4" fill="#8b5cf6"/>
  <rect x="220" y="356" width="14" height="24" rx="4" fill="#8b5cf6"/>
  <rect x="254" y="356" width="14" height="24" rx="4" fill="#8b5cf6"/>
  <rect x="288" y="356" width="14" height="24" rx="4" fill="#8b5cf6"/>
  <rect x="312" y="356" width="14" height="24" rx="4" fill="#8b5cf6"/>

  <!-- BH Letters -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">BH</text>
  <text x="256" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="4">TKJ</text>
</svg>
